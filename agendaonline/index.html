<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento Online – Dicró Odontologia</title>
  <meta http-equiv="refresh" content="0; url=https://app.simplesdental.com/simples/agendamento/dicro">
  <meta name="robots" content="noindex, nofollow">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}
    .card{background:#fff;border-radius:16px;padding:40px 32px;max-width:420px;box-shadow:0 4px 24px rgba(0,0,0,.10)}
    .logo{font-size:2rem;font-weight:800;color:#1B2A4A;letter-spacing:-1px;margin-bottom:8px;font-family:'Playfair Display',serif}
    .logo span{color:#C9A24B}
    p{color:#555;font-size:1rem;line-height:1.6;margin-bottom:24px}
    .spinner{width:40px;height:40px;border:4px solid #e0eaf3;border-top-color:#1B2A4A;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 24px}
    @keyframes spin{to{transform:rotate(360deg)}}
    a.btn{display:inline-block;background:#1B2A4A;color:#fff;padding:13px 28px;border-radius:8px;text-decoration:none;font-weight:700;font-size:1rem}
    a.btn:hover{background:#101D38}
    .footer{margin-top:24px;font-size:.8rem;color:#aaa}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Dicró<span>.</span></div>
    <div class="spinner"></div>
    <p>Redirecionando para o <strong>Agendamento Online</strong>…</p>
    <a class="btn" href="https://app.simplesdental.com/simples/agendamento/dicro">Clique aqui se não for redirecionado</a>
    <div class="footer">Dicró Odontologia Especializada · Mesquita, RJ</div>
  </div>
  <script>window.location.replace("https://app.simplesdental.com/simples/agendamento/dicro");</script>
</body>
</html>
