<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chegar de Uber | Dicró Odontologia Especializada</title>
<meta name="robots" content="noindex, nofollow">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-B7SREJMBQ6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-B7SREJMBQ6');
</script>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1B2A4A;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    text-align: center;
    color: #ffffff;
  }
  .card {
    padding: 32px;
    max-width: 360px;
  }
  .card img {
    width: 56px;
    height: 56px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px;
    color: #C9A24B;
  }
  p {
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 24px;
    color: #e6e6e6;
  }
  a.btn {
    display: inline-block;
    background: #C9A24B;
    color: #1B2A4A;
    font-weight: 600;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 8px;
    font-size: 15px;
  }
  .spinner {
    width: 24px;
    height: 24px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #C9A24B;
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Dicró Odontologia Especializada</h1>
    <p>Abrindo o Uber com o destino já preenchido...</p>
    <a class="btn" id="fallback" href="#">Abrir manualmente</a>
  </div>

<script>
  var uberUrl = "https://m.uber.com/ul/?action=setPickup"
    + "&dropoff[latitude]=-22.7826359"
    + "&dropoff[longitude]=-43.4275274"
    + "&dropoff[nickname]=" + encodeURIComponent("Dicró Odontologia Especializada")
    + "&dropoff[formatted_address]=" + encodeURIComponent("Praça João Luís do Nascimento, 28 - Loja 2, Mesquita - RJ");

  document.getElementById('fallback').href = uberUrl;

  gtag('event', 'uber_redirect_click', {
    'event_category': 'localizacao',
    'event_label': 'dicro_com_br_uber'
  });

  setTimeout(function () {
    window.location.href = uberUrl;
  }, 400);
</script>
</body>
</html>
