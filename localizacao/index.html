<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dicró Odontologia — Como Chegar</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #0e1f3d;
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --cream: #faf8f3;
      --text: #1a1a2e;
      --muted: #6b7280;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
    }

    /* Header */
    header {
      background: var(--navy);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
    }

    .logo-text {
      font-family: 'Playfair Display', serif;
      color: var(--gold);
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .logo-sub {
      color: rgba(255,255,255,0.55);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 300;
    }

    /* Hero strip */
    .hero-strip {
      background: linear-gradient(135deg, var(--navy) 0%, #1a3160 100%);
      padding: 40px 32px 36px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero-strip::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 70% 50%, rgba(201,168,76,0.12) 0%, transparent 60%);
    }

    .hero-strip h1 {
      font-family: 'Playfair Display', serif;
      color: #fff;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      position: relative;
      z-index: 1;
    }

    .hero-strip h1 span {
      color: var(--gold);
    }

    .hero-strip p {
      color: rgba(255,255,255,0.65);
      margin-top: 8px;
      font-size: 0.9rem;
      font-weight: 300;
      position: relative;
      z-index: 1;
    }

    /* Main layout */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 24px 60px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: start;
    }

    @media (max-width: 680px) {
      .container { grid-template-columns: 1fr; }
    }

    /* Info card */
    .info-card {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 2px 20px rgba(14,31,61,0.08);
      border-top: 4px solid var(--gold);
    }

    .info-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: var(--navy);
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid #ede8dc;
    }

    .info-row {
      display: flex;
      gap: 14px;
      margin-bottom: 20px;
      align-items: flex-start;
    }

    .info-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--navy), #1a3160);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .info-icon svg {
      width: 18px;
      height: 18px;
      fill: var(--gold);
    }

    .info-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 3px;
    }

    .info-value {
      font-size: 0.92rem;
      color: var(--text);
      line-height: 1.5;
      font-weight: 400;
    }

    .info-value strong {
      color: var(--navy);
    }

    /* CTA buttons */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 28px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 20px;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: var(--gold);
      color: var(--navy);
    }
    .btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); }

    .btn-secondary {
      background: transparent;
      color: var(--navy);
      border: 1.5px solid #ddd4bc;
    }
    .btn-secondary:hover { border-color: var(--gold); color: var(--gold); }

    .btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* Map */
    .map-card {
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 20px rgba(14,31,61,0.1);
      position: relative;
    }

    .map-card iframe {
      width: 100%;
      height: 420px;
      border: none;
      display: block;
    }

    .map-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--navy);
      color: var(--gold);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 6px;
    }

    /* Footer note */
    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0 24px 32px;
    }

    .footer-note a {
      color: var(--gold);
      text-decoration: none;
    }
  </style>
